name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  build:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          if [ "$GOOS" = "windows" ]; then
            out="dist/sshctl-${GOOS}-${GOARCH}.exe"
          else
            out="dist/sshctl-${GOOS}-${GOARCH}"
          fi
          go build -ldflags "-s -w -X github.com/Fracizz/sshctl/cmd.Version=${VERSION}" -o "$out" .
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: sshctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/sshctl-*
            !dist/*.zip

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: sshctl-*
          merge-multiple: true
      - name: Pack AI skill zip
        run: |
          set -euo pipefail
          ls -la artifacts
          mkdir -p skillpack/sshctl/bin
          cp skills/sshctl/SKILL.md skillpack/sshctl/SKILL.md
          cp artifacts/sshctl-windows-amd64.exe skillpack/sshctl/bin/
          cp artifacts/sshctl-windows-arm64.exe skillpack/sshctl/bin/
          cp artifacts/sshctl-linux-amd64 skillpack/sshctl/bin/
          cp artifacts/sshctl-linux-arm64 skillpack/sshctl/bin/
          cp artifacts/sshctl-darwin-amd64 skillpack/sshctl/bin/
          cp artifacts/sshctl-darwin-arm64 skillpack/sshctl/bin/
          cp artifacts/sshctl-windows-amd64.exe skillpack/sshctl/bin/sshctl.exe
          (cd skillpack && zip -r ../artifacts/sshctl-skill.zip sshctl)
          ls -la artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/sshctl-windows-*.exe
            artifacts/sshctl-linux-*
            artifacts/sshctl-darwin-*
            artifacts/sshctl-skill.zip
          generate_release_notes: true
          body: |
            ## Binaries

            Download the executable for your platform (no zip):

            | Platform | Asset |
            |----------|--------|
            | Windows amd64 | `sshctl-windows-amd64.exe` |
            | Windows arm64 | `sshctl-windows-arm64.exe` |
            | Linux amd64 | `sshctl-linux-amd64` |
            | Linux arm64 | `sshctl-linux-arm64` |
            | macOS Intel | `sshctl-darwin-amd64` |
            | macOS Apple Silicon | `sshctl-darwin-arm64` |

            ## AI skill pack

            | Asset | Install |
            |-------|---------|
            | `sshctl-skill.zip` | Unzip into `~/.claude/skills/`, `~/.cursor/skills/`, or `~/.codex/skills/` (creates `.../skills/sshctl/` with `SKILL.md` + `bin/`) |

            Windows Agent default binary: `bin/sshctl.exe` (same as windows-amd64).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
